name: Auto Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan Link Video YouTube / URL Direct Video'
        required: true
        default: 'https://www.youtube.com/watch?v=...'

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Video via yt-dlp
        run: |
          yt-dlp --no-playlist -f "b[ext=mp4]/bv*[ext=mp4]+ba[ext=m4a]/b" \
            --recode-video mp4 \
            -o "input.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: Check Downloaded File
        run: ls -la

      - name: Run Auto Clipper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload Output Clips (Download Button)
        uses: actions/upload-artifact@v4
        with:
          name: auto-clipped-parts
          path: output/
