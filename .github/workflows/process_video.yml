name: Auto Clipper (Manual Input)

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Input Video
        run: |
          if [ ! -f "input.mp4" ]; then
            echo "ERROR: File 'input.mp4' tidak ditemukan di repositori!"
            echo "Silakan upload file video Anda dan beri nama 'input.mp4' sebelum menjalankan Actions."
            exit 1
          fi
          echo "File input.mp4 berhasil ditemukan. Memulai proses pemotongan..."

      - name: Run Auto Clipper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload Output Clips
        uses: actions/upload-artifact@v4
        with:
          name: auto-clipped-parts
          path: output/
