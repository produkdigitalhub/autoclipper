- name: Download Video (yt-dlp with Fallback)
        run: |
          URL="${{ github.event.inputs.video_url }}"
          
          # Coba download via yt-dlp dengan client iOS / TV
          yt-dlp --no-playlist \
            --cookies cookies.txt \
            --extractor-args "youtube:player_client=ios,tv" \
            -f "b[ext=mp4]/bv*[ext=mp4]+ba[ext=m4a]/b" \
            --recode-video mp4 \
            --output "input.mp4" \
            "$URL" || {
              echo "yt-dlp gagal karena Error 429. Menggunakan Cobalt API Fallback..."
              
              # Extract Video ID dari URL YouTube
              VIDEO_ID=$(echo "$URL" | grep -oP '(v=|\/)([a-zA-Z0-9_-]{11})' | grep -oP '[a-zA-Z0-9_-]{11}')
              CLEAN_URL="https://www.youtube.com/watch?v=$VIDEO_ID"
              
              curl -X POST "https://api.cobalt.tools/api/json" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "{\"url\": \"$CLEAN_URL\", \"videoQuality\": \"720\"}" \
                -o cobalt_response.json
              
              DOWNLOAD_URL=$(python -c "import json; print(json.load(open('cobalt_response.json')).get('url', ''))")
              
              if [ -n "$DOWNLOAD_URL" ]; then
                echo "Mengunduh file video dari Cobalt mirror..."
                curl -L "$DOWNLOAD_URL" -o input.mp4
              else
                echo "Gagal mendapatkan link download alternatif."
                exit 1
              fi
            }
